<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EmpTrack — Departments</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app-layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">👥</div>
      <div>
        <div class="logo-text">EmpTrack</div>
        <div class="logo-sub">Employee Management</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-title">Main</div>
      <a href="index.html"       class="nav-link"><span class="icon">🏠</span> Dashboard</a>
      <a href="employees.html"   class="nav-link"><span class="icon">👤</span> Employees</a>
      <a href="departments.html" class="nav-link active"><span class="icon">🏢</span> Departments</a>
      <div class="nav-section-title">Actions</div>
      <a href="add-employee.html" class="nav-link"><span class="icon">➕</span> Add Employee</a>
    </nav>
    <div class="sidebar-footer">EmpTrack v1.0 &copy; 2025</div>
  </aside>

  <!-- MAIN -->
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-title">Departments</div>
      <div class="topbar-actions">
        <div class="topbar-user">
          <div class="topbar-user-avatar">AD</div>
          <span class="topbar-user-name">Admin</span>
        </div>
      </div>
    </header>

    <main class="page-body">
      <div class="page-header">
        <div>
          <h1>🏢 Departments</h1>
          <p>Add, edit, or remove departments in your organisation.</p>
        </div>
      </div>

      <!-- Department Cards Grid -->
      <div class="dept-grid" id="dept-grid">
        <p style="color:#94a3b8">Loading departments…</p>
      </div>

      <!-- Add / Edit Form -->
      <div class="dept-form-panel">
        <h3 id="dept-form-title">➕ Add Department</h3>
        <form id="dept-form">
          <input type="hidden" id="dept-id" />
          <div class="form-grid">
            <div class="form-group">
              <label for="dept-name-input">Department Name *</label>
              <input type="text" id="dept-name-input" placeholder="e.g. Engineering" required />
            </div>
            <div class="form-group">
              <label for="dept-desc-input">Description</label>
              <input type="text" id="dept-desc-input" placeholder="Short description…" />
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="dept-submit-btn">Add Department</button>
            <button type="button" class="btn btn-secondary" id="dept-cancel-btn"
                    style="display:none" onclick="resetDeptForm()">Cancel</button>
          </div>
        </form>
      </div>
    </main>
  </div>
</div>

<div id="toast-container"></div>
<script src="js/config.js"></script>
<script src="js/departments.js"></script>
</body>
</html>
